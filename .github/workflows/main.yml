name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps
      
      - name: Install esbuild
        working-directory: desktop
        run: npm install --save-dev esbuild --legacy-peer-deps

      - name: Remove missing icon references from package.json
        working-directory: desktop
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${{ github.event.inputs.version }}';
          if (pkg.build) {
            if (pkg.build.win) delete pkg.build.win.icon;
            if (pkg.build.nsis) {
              delete pkg.build.nsis.installerIcon;
              delete pkg.build.nsis.uninstallerIcon;
              delete pkg.build.nsis.installerHeaderIcon;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('package.json updated');
          "
          cat package.json

      - name: Build renderer (React UI)
        working-directory: desktop
        run: npx vite build
      
      - name: Build main process (esbuild)
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p dist/main
          npx esbuild src/main/main.ts --bundle --platform=node --target=node18 --external:electron --external:better-sqlite3 --external:@ffmpeg-installer/ffmpeg --external:fluent-ffmpeg --external:music-metadata --external:electron-store --outfile=dist/main/main.js
          npx esbuild src/main/preload.ts --bundle --platform=node --target=node18 --external:electron --outfile=dist/main/preload.js
      
      - name: Package Windows exe
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      
      - name: List built files
        shell: bash
        run: |
          echo "=== desktop/release contents ==="
          ls -la desktop/release/ || true
          echo "=== .exe files ==="
          find desktop/release -name "*.exe" || true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicRefine-Windows
          path: desktop/release/*.exe
          if-no-files-found: warn
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: SonicRefine v${{ github.event.inputs.version }}
          body: |
            ## 🎵 SonicRefine v${{ github.event.inputs.version }}
            
            **100% Free** • Offline • No limits • MIT License
            
            ### 📥 Download
            - **SonicRefine-Setup-${{ github.event.inputs.version }}.exe** — установщик
            - **SonicRefine-Portable-${{ github.event.inputs.version }}.exe** — portable
            
            ### ✨ Features
            - Работает без интернета
            - Локальная обработка аудио через FFmpeg
            - Форматы: MP3, WAV, FLAC, AAC
          files: desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
