name: Build Desktop (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create vite.config.ts
        shell: pwsh
        working-directory: desktop
        run: |
          @"
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import path from 'path';
          export default defineConfig({
            plugins: [react()],
            root: path.resolve(__dirname, 'src/renderer'),
            base: './',
            build: {
              outDir: path.resolve(__dirname, 'dist/renderer'),
              emptyOutDir: true,
            },
          });
          "@ | Out-File -FilePath vite.config.ts -Encoding UTF8

      - name: Install dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps

      - name: Build app
        working-directory: desktop
        run: |
          npx vite build
          npx tsc -p tsconfig.main.json

      - name: Package exe
        working-directory: desktop
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: SonicRefine v${{ github.event.inputs.version }}
          body: |
            ## 🎵 SonicRefine v${{ github.event.inputs.version }}
            
            **100% Free** • Offline • No limits
            
            - **Setup** — установщик
            - **Portable** — без установки
          files: |
            desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
